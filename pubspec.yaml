name: wonderflix
description: "A new Flutter project."
publish_to: 'none'
version: 0.9.0

environment:
  sdk: ^3.9.2

dependencies:
  cached_network_image: ^4.0.2
  clock: ^1.1.3
  crypto: ^3.0.7
  dio: ^5.11.1
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_blurhash: ^0.9.1
  flutter_cache_manager: ^3.4.5
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.3.2
  # Versione esatta usata per generare smtc_windows 1.1.0 (il crate Rust è
  # fissato a =2.11.1): con un'altra versione SMTC non si inizializza.
  flutter_rust_bridge: 2.11.1
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: any
  logging: ^1.3.0
  lucide_icons_flutter: ^3.1.20
  media_kit: ^1.2.6
  media_kit_libs_windows_video: ^1.0.11
  media_kit_video: ^2.0.1
  package_info_plus: ^10.2.1
  pub_semver: ^2.2.1
  screen_retriever: ^0.2.2
  shared_preferences: ^2.5.5
  smtc_windows: ^1.1.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
