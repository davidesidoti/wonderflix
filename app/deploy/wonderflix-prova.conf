# WonderFlix web, sito di PROVA (build Flutter statica con --base-href /wonderflix-prova/) -> ~/.apps/nginx/proxy.d/wonderflix-prova.conf su ultra.cc
location = /wonderflix-prova { return 301 /wonderflix-prova/; }
location /wonderflix-prova/ {
    alias /home/hashvps/wonderflix-web-prova/;
    index index.html;
    access_log off;   # niente ApiKey nei log; il sito è statico
    # Isolamento cross-origin: senza, skwasm gira su un solo thread e l'interfaccia scatta.
    # add_header non si eredita nei location annidati: va ripetuto in ognuno.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
    }
    # mime.types non conosce .mjs: senza un tipo JS il browser rifiuta il modulo
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
    }
    location ~* (index\.html|flutter_bootstrap\.js|main\.dart\.(js|mjs|wasm))$ {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
    }
}
