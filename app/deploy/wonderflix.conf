# WonderFlix web (build Flutter statica) -> ~/.apps/nginx/proxy.d/wonderflix.conf su ultra.cc
location = /wonderflix { return 301 /wonderflix/; }
location /wonderflix/ {
    alias /home/hashvps/wonderflix-web/;
    index index.html;
    access_log off;   # niente ApiKey nei log; il sito è statico
    # Isolamento cross-origin: senza, skwasm gira su un solo thread e l'interfaccia scatta.
    # require-corp e non credentialless: Safari (iPhone) non conosce credentialless e resterebbe senza isolamento.
    # add_header non si eredita nei location annidati: va ripetuto in ognuno.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }
    # mime.types non conosce .mjs: senza un tipo JS il browser rifiuta il modulo
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }
    # APK della TV (job android di release.yml): lo scarica Downloader da un indirizzo fisso.
    # types vuoto: mime.types potrebbe non conoscere .apk.
    location = /wonderflix/tv.apk {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }
    location ~* (index\.html|flutter_bootstrap\.js|push_sw\.js|main\.dart\.(js|mjs|wasm))$ {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }
}
