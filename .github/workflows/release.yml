name: Release

# Parte con un tag vX.Y.Z (deve coincidere con la versione di pubspec.yaml).
# La GitHub Release viene creata come bozza: la pubblicazione è manuale
# (docs/RELEASING.md).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Versione
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          $version = ($line.Matches[0].Groups[1].Value -split '\+')[0]
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Versione $version non valida: solo versioni X.Y.Z; per le prove usa una pre-release da una versione normale (docs/RELEASING.md)"
            exit 1
          }
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            Write-Error "Il tag $env:GITHUB_REF_NAME non corrisponde alla versione di pubspec.yaml ($version)"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Configurazione dai Secrets
        shell: pwsh
        env:
          SERVER_URL: ${{ secrets.WONDERFLIX_SERVER_URL }}
          DISCORD_APP_ID: ${{ secrets.WONDERFLIX_DISCORD_APP_ID }}
          SUPPORT_URL: ${{ secrets.WONDERFLIX_SUPPORT_URL }}
          ACCESS_REQUEST_URL: ${{ secrets.WONDERFLIX_ACCESS_REQUEST_URL }}
        run: |
          if (-not $env:SERVER_URL) {
            Write-Error 'Manca il Secret WONDERFLIX_SERVER_URL (docs/RELEASING.md)'
            exit 1
          }
          [ordered]@{
            serverUrl        = $env:SERVER_URL
            githubRepo       = $env:GITHUB_REPOSITORY
            discordAppId     = "$env:DISCORD_APP_ID"
            supportUrl       = "$env:SUPPORT_URL"
            accessRequestUrl = "$env:ACCESS_REQUEST_URL"
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM config/wonderflix.json

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

      - run: flutter build windows --release --dart-define-from-file=config/wonderflix.json

      - name: Runtime di Visual C++ accanto all'exe
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build\windows\x64\runner\Release\
          }

      # Firma del codice: pronta ma spenta finché non c'è un certificato
      # (Secrets WONDERFLIX_SIGNING_CERT in base64 e WONDERFLIX_SIGNING_PASSWORD).
      - name: Firma dell'app (disattivata)
        if: ${{ false }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('cert.pfx', [Convert]::FromBase64String('${{ secrets.WONDERFLIX_SIGNING_CERT }}'))
          signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f cert.pfx /p '${{ secrets.WONDERFLIX_SIGNING_PASSWORD }}' build\windows\x64\runner\Release\wonderflix.exe

      # Versione fissa: un aggiornamento dell'immagine del runner non cambia
      # l'installer senza che ce ne accorgiamo.
      - name: Inno Setup 6.7.1
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress --allow-downgrade
          if ($LASTEXITCODE -notin 0, 1641, 3010) {
            Write-Error "Installazione di Inno Setup 6.7.1 non riuscita (codice $LASTEXITCODE)"
            exit 1
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe non trovato in $iscc dopo l'installazione di Inno Setup"
            exit 1
          }
          exit 0

      - name: Installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\wonderflix.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Firma dell'installer (disattivata)
        if: ${{ false }}
        shell: pwsh
        run: |
          signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f cert.pfx /p '${{ secrets.WONDERFLIX_SIGNING_PASSWORD }}' "dist\WonderFlix-Setup-${{ steps.version.outputs.version }}.exe"

      - name: SHA-256
        shell: pwsh
        run: |
          $name = "WonderFlix-Setup-${{ steps.version.outputs.version }}.exe"
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ascii -NoNewline -Path "dist\$name.sha256" -Value "$hash  $name"

      - uses: actions/upload-artifact@v4
        with:
          name: wonderflix-setup
          path: app/dist/*

      - name: GitHub Release (bozza)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pipeline rilanciata sullo stesso tag: la release esiste già, si
          # sostituiscono solo i file (note e stato restano).
          gh release view $env:GITHUB_REF_NAME *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          # Elenco esplicito dei file: su Windows `dist/*` non è espanso da pwsh.
          $assets = (Get-ChildItem dist -File).FullName
          if ($exists) {
            gh release upload $env:GITHUB_REF_NAME $assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $assets --draft --title "WonderFlix ${{ steps.version.outputs.version }}" --notes "Scrivi qui le note di rilascio (docs/RELEASING.md)."
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # APK della TV (armeabi-v7a + arm64-v8a), firmato con la chiave di rilascio,
  # aggiunto alla bozza creata da `release`.
  android:
    needs: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Versione
        id: version
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n1)
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versione $version non valida: solo versioni X.Y.Z (docs/RELEASING.md)"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Il tag $GITHUB_REF_NAME non corrisponde alla versione di pubspec.yaml ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configurazione dai Secrets
        env:
          SERVER_URL: ${{ secrets.WONDERFLIX_SERVER_URL }}
          DISCORD_APP_ID: ${{ secrets.WONDERFLIX_DISCORD_APP_ID }}
          SUPPORT_URL: ${{ secrets.WONDERFLIX_SUPPORT_URL }}
          ACCESS_REQUEST_URL: ${{ secrets.WONDERFLIX_ACCESS_REQUEST_URL }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "::error::Manca il Secret WONDERFLIX_SERVER_URL (docs/RELEASING.md)"
            exit 1
          fi
          jq -n \
            --arg serverUrl "$SERVER_URL" \
            --arg githubRepo "$GITHUB_REPOSITORY" \
            --arg discordAppId "$DISCORD_APP_ID" \
            --arg supportUrl "$SUPPORT_URL" \
            --arg accessRequestUrl "$ACCESS_REQUEST_URL" \
            '$ARGS.named' > config/wonderflix.json

      # Mai un APK di rilascio con la chiave di debug: senza i Secrets il job fallisce.
      - name: Chiave di firma dai Secrets
        env:
          KEYSTORE: ${{ secrets.WONDERFLIX_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.WONDERFLIX_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Mancano i Secrets WONDERFLIX_ANDROID_KEYSTORE / WONDERFLIX_ANDROID_KEYSTORE_PASSWORD (app/android/create_release_key.sh)"
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > android/wonderflix-release.jks
          printf 'storeFile=../wonderflix-release.jks\nstorePassword=%s\nkeyAlias=wonderflix\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --release --dart-define-from-file=config/wonderflix.json

      - name: APK e SHA-256
        run: |
          name="WonderFlix-TV-${{ steps.version.outputs.version }}.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$name"
          printf '%s  %s' "$(sha256sum "dist/$name" | cut -d' ' -f1)" "$name" > "dist/$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: wonderflix-tv
          path: app/dist/*

      - name: Nella GitHub Release (bozza)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - name: Via la chiave di firma
        if: always()
        run: rm -f android/key.properties android/wonderflix-release.jks

  # Sito web: build wasm e copia sul server via rsync (docs/RELEASING.md, "Sito web").
  web:
    # Il sito esce solo se le release di Windows e della TV sono riuscite
    # (tv.apk viene dall'artefatto del job android).
    needs: [release, android]
    permissions:
      contents: read
    concurrency:
      group: web-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Configurazione dai Secrets
        env:
          SERVER_URL: ${{ secrets.WONDERFLIX_SERVER_URL }}
          DISCORD_APP_ID: ${{ secrets.WONDERFLIX_DISCORD_APP_ID }}
          SUPPORT_URL: ${{ secrets.WONDERFLIX_SUPPORT_URL }}
          ACCESS_REQUEST_URL: ${{ secrets.WONDERFLIX_ACCESS_REQUEST_URL }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "::error::Manca il Secret WONDERFLIX_SERVER_URL (docs/RELEASING.md)"
            exit 1
          fi
          jq -n \
            --arg serverUrl "$SERVER_URL" \
            --arg githubRepo "$GITHUB_REPOSITORY" \
            --arg discordAppId "$DISCORD_APP_ID" \
            --arg supportUrl "$SUPPORT_URL" \
            --arg accessRequestUrl "$ACCESS_REQUEST_URL" \
            '$ARGS.named' > config/wonderflix.json

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build web --release --wasm --base-href /wonderflix/ --pwa-strategy=none --dart-define-from-file=config/wonderflix.json

      - uses: actions/download-artifact@v4
        with:
          name: wonderflix-tv
          path: app/dist-tv

      # Prima del primo rsync: con --delete un tv.apk assente sparirebbe dal sito.
      - name: tv.apk nel sito
        run: cp dist-tv/WonderFlix-TV-*.apk build/web/tv.apk

      - name: Chiave di deploy
        env:
          DEPLOY_KEY: ${{ secrets.WONDERFLIX_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WONDERFLIX_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Mancano i Secrets WONDERFLIX_DEPLOY_SSH_KEY / WONDERFLIX_DEPLOY_KNOWN_HOSTS (docs/RELEASING.md)"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # La chiave sul server è vincolata a rrsync sulla cartella del sito:
      # la destinazione è relativa a quella cartella. index.html va per ultimo,
      # così il sito non punta a file non ancora copiati.
      - name: Pubblicazione sul server
        run: |
          rsync -az --delete --exclude index.html -e "ssh -i ~/.ssh/id_deploy" build/web/ hashvps@46.232.210.229:
          rsync -az -e "ssh -i ~/.ssh/id_deploy" build/web/index.html hashvps@46.232.210.229:
